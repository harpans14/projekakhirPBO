spring.application.name=trashformer

# =============================================================================
# Database Configuration
# =============================================================================
# Railway MySQL menyediakan env var: MYSQLHOST, MYSQLPORT, MYSQLDATABASE,
# MYSQLUSER, MYSQLPASSWORD. Default value untuk development lokal (XAMPP).
#
# Di Railway WAJIB set: MYSQL_SSL=true
# Di lokal: MYSQL_SSL=false (default)
# =============================================================================
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:trashformer_db}?useSSL=${MYSQL_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta&connectTimeout=30000
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP) — kecil biar hemat memory di free tier
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =============================================================================
# JPA / Hibernate
# =============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Jakarta

# SQL init — jalankan data.sql jika database masih kosong
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# =============================================================================
# Server
# =============================================================================
server.port=${PORT:8080}

# =============================================================================
# Session
# =============================================================================
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie

# =============================================================================
# File Upload (Multipart)
# =============================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# =============================================================================
# Upload Directory
# =============================================================================
app.upload.dir=${UPLOAD_DIR:uploads/bukti_pembayaran}
