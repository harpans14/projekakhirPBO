spring.application.name=trashformer

# =============================================================================
# Database Configuration — Railway MySQL
# =============================================================================
# Railway MySQL plugin menyediakan MYSQL_URL (full JDBC URL + SSL).
# Jika MYSQL_URL tersedia, itu dipakai langsung (SSL sudah otomatis).
# Fallback: konstruksi dari MYSQLHOST/MYSQLPORT/MYSQLDATABASE untuk lokal.
# =============================================================================
spring.datasource.url=${MYSQL_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:trashformer_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Jakarta}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =============================================================================
# JPA / Hibernate
# =============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Jakarta

# =============================================================================
# Server
# =============================================================================
server.port=${PORT:8080}

# =============================================================================
# Session
# =============================================================================
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie

# =============================================================================
# File Upload (Multipart)
# =============================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# =============================================================================
# Upload Directory
# =============================================================================
app.upload.dir=${UPLOAD_DIR:uploads/bukti_pembayaran}
