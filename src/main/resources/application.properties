spring.application.name=trashformer

# ========================
# Database Configuration
# ========================
# Railway MySQL plugin provides MYSQL_URL, MYSQL_USER, MYSQL_PASSWORD
# Fallback to localhost for local development
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/trashformer_db}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# ========================
# JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================
# Server
# ========================
server.port=${PORT:8080}

# ========================
# Session
# ========================
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie

# ========================
# File Upload Multipart
# ========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ========================
# Upload Directory
# ========================
app.upload.dir=${UPLOAD_DIR:uploads/bukti_pembayaran}