<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="layout">
<head>
    <title>Kelola Kategori Sampah</title>
</head>
<body>
    <div layout:fragment="content">
        <h4 class="page-title">Kelola Kategori Sampah</h4>

        <div th:if="${param.suksesTambah}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i>Kategori baru berhasil ditambahkan!
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <div class="col-lg-5">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-plus-circle me-2"></i>Tambah Kategori Baru
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/kategori/simpan}" method="post">
                            <div class="mb-3">
                                <label for="namaKategori" class="form-label">Nama Kategori <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="namaKategori" name="namaKategori"
                                       placeholder="Contoh: Plastik, Kertas, Organik" required>
                                <div class="form-text">Masukkan nama jenis sampah baru.</div>
                            </div>
                            <div class="mb-3">
                                <label for="hargaPerKg" class="form-label">Harga per Kg (Rp) <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="hargaPerKg" name="hargaPerKg"
                                       step="100" min="0" required
                                       placeholder="Contoh: 5000">
                                <div class="form-text">Harga pembelian per kilogram untuk kategori ini.</div>
                            </div>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save me-1"></i>Simpan
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-list me-2"></i>Daftar Kategori
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th>No</th>
                                        <th>Nama Kategori</th>
                                        <th>Harga per Kg</th>
                                        <th>Dibuat</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="k, stat : ${listKategori}">
                                        <td th:text="${stat.count}">1</td>
                                        <td th:text="${k.nama}">Organik</td>
                                        <td>
                                            <span class="badge bg-success" th:if="${k.hargaPerKg != null}">
                                                Rp <span th:text="${k.hargaPerKg}">5.000</span>/kg
                                            </span>
                                            <span class="text-muted" th:if="${k.hargaPerKg == null}">-</span>
                                        </td>
                                        <td th:text="${#temporals.format(k.createdAt, 'dd-MM-yyyy HH:mm')}">01-01-2024</td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(listKategori)}">
                                        <td colspan="4" class="text-center text-muted py-4">
                                            <i class="fas fa-inbox me-2"></i>Belum ada kategori sampah
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
